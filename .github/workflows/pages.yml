# Deploys the static site to GitHub Pages.
# Settings > Pages > Source must be "GitHub Actions" before a push to main can deploy.
# Pull requests assemble and upload the site without calling the Pages API, which 404s until that source is set.
# actions/configure-pages runs on push to main, not on pull_request.
# Upload and deploy are separate jobs so the github-pages artifact is listed before deploy-pages reads it.

name: Deploy static site to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate movie data
        run: node scripts/validate-data.js
      - name: Validate awards
        run: node scripts/validate-awards.js
      - name: Check catalog behavior
        run: node scripts/check-catalog.js

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate movie data
        run: node scripts/validate-data.js
      - name: Validate awards
        run: node scripts/validate-awards.js
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html embed-demo.html favicon.svg _site/
          cp -r css js data fonts _site/
          node scripts/export-csv.js _site/data/catalog.csv
          node scripts/build-catalog.js _site/data
          node scripts/build-embed.js _site/embed.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
